<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EarPiano</title>
<style>
  :root {
    --bg:      #0e0e0e;
    --surface: #1c1c1c;
    --white:   #efefed;
    --black:   #161616;
    --act-w:   #3d7fff;
    --act-b:   #1e4fcc;
    --text:    #fff;
    --muted:   rgba(255,255,255,0.22);
    --mono:    "SF Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,8px);
  }
  /* ヘッダー */
  #hdr { flex-shrink:0; padding:10px 18px 6px; }
  #logo { font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }

  /* 音名表示 */
  #display { flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:6px 0 10px; gap:4px; }
  #note { font-family:var(--mono); font-size:60px; font-weight:100; line-height:1; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; text-align:center; transition:font-size .1s; }
  #note.chord { font-size:30px; }
  #sub  { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.08em; }

  /* オクターブ */
  #oct-row { flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 0 10px; }
  .obtn { width:44px; height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:var(--surface); color:var(--text); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .obtn.off { opacity:.18; pointer-events:none; }
  #oct-lbl { font-family:var(--mono); font-size:14px; width:110px; text-align:center; }

  /* 鍵盤エリア */
  #kbs { flex:1; display:flex; gap:6px; padding:0 10px 10px; min-height:0; }
  .col { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .clbl { font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center; flex-shrink:0; }
  .kb { flex:1; position:relative; min-height:0; border-radius:6px; }

  /* 鍵 */
  .wk, .bk { position:absolute; left:0; border-radius:5px; cursor:pointer; }
  .wk { background:var(--white); border:1px solid rgba(0,0,0,.15); width:100%; }
  .wk.on { background:var(--act-w); }
  .bk { background:var(--black); z-index:2; box-shadow:-3px 3px 8px rgba(0,0,0,.7); }
  .bk.on { background:var(--act-b); }
  .wlbl { position:absolute; bottom:5px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:9px; color:rgba(0,0,0,.28); pointer-events:none; }
  .wlbl-top { bottom:auto; top:5px; }
  .wk.on .wlbl { color:rgba(255,255,255,.75); }
</style>
</head>
<body>
<div id="app">
  <div id="hdr"><span id="logo">EarPiano</span></div>
  <div id="display">
    <div id="note">---</div>
    <div id="sub">押している音</div>
  </div>
  <div id="oct-row">
    <div class="obtn" id="od">‹</div>
    <div id="oct-lbl">Oct 3 · 4</div>
    <div class="obtn" id="ou">›</div>
  </div>
  <div id="kbs">
    <div class="col">
      <div class="clbl" id="ll">Oct 3</div>
      <div class="kb" id="kl"></div>
    </div>
    <div class="col">
      <div class="clbl" id="lr">Oct 4</div>
      <div class="kb" id="kr"></div>
    </div>
  </div>
</div>

<script>
// ── Audio ─────────────────────────────────────
let AC = null;
const oscs = {};
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function initAC() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e) {}
}
function midi2freq(m) { return 440 * Math.pow(2,(m-69)/12); }
function midi2name(m) { return NAMES[m%12] + (Math.floor(m/12)-1); }

function noteOn(midi) {
  if (oscs[midi]) return;
  initAC(); if (!AC) return;
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  try {
    osc.setPeriodicWave(AC.createPeriodicWave(
      new Float32Array([0,1,.28,.08,.02]),
      new Float32Array(5)
    ));
  } catch(e) { osc.type = 'sine'; }
  osc.frequency.value = midi2freq(midi);
  gain.gain.setValueAtTime(0, AC.currentTime);
  gain.gain.linearRampToValueAtTime(0.22, AC.currentTime+0.008);
  osc.connect(gain); gain.connect(AC.destination); osc.start();
  oscs[midi] = {osc, gain};
}
function noteOff(midi) {
  const o = oscs[midi]; if (!o) return;
  if (AC) o.gain.gain.setTargetAtTime(0, AC.currentTime, 0.07);
  setTimeout(() => { try{o.osc.stop();}catch(e){} delete oscs[midi]; }, 500);
}

// ── レイアウト定義 ────────────────────────────
// 白鍵: 下(C)→上(B) の順, index=0がC
const WD = [{s:12},{s:11},{s:9},{s:7},{s:5},{s:4},{s:2},{s:0}]; // 高いC→C（高音=上）
// 黒鍵: between = 下からの白鍵index（between=0はCとDの間）
const BD = [{s:10,b:1},{s:8,b:2},{s:6,b:3},{s:3,b:5},{s:1,b:6}]; // 高音側から

// ── キーデータ（座標キャッシュ）─────────────
// kd['l' or 'r'] = [{midi, x, y, w, h, el}]
const kd = {l:[], r:[]};
let baseOct = 3;

function buildCol(side, oct) {
  const el = document.getElementById(side === 'l' ? 'kl' : 'kr');
  el.innerHTML = '';
  kd[side] = [];

  // サイズ取得（0なら再試行）
  const W = el.offsetWidth;
  const H = el.offsetHeight;
  if (!W || !H) { setTimeout(() => buildCol(side, oct), 50); return; }

  const gap = 1.5;
  const wh  = (H - gap*7) / 8;   // 白鍵の高さ（C〜高いC = 8鍵）
  const bh  = wh * 0.62;          // 黒鍵の高さ
  const bw  = W * 0.52;           // 黒鍵の幅

  // 白鍵（i=0=C が一番上 → 低音が上）
  WD.forEach((def, i) => {
    const midi = (oct+1)*12 + def.s;
    const y    = i * (wh + gap);   // 上から積む（低音=上）
    const div  = document.createElement('div');
    div.className = 'wk';
    div.style.cssText = `top:${y}px;height:${wh}px;width:${W}px;`;
    if (def.s === 0 || def.s === 12) {
      const lbl = document.createElement('span');
      lbl.className = def.s === 12 ? 'wlbl wlbl-top' : 'wlbl';
      lbl.textContent = midi2name(midi);
      div.appendChild(lbl);
    }
    el.appendChild(div);
    kd[side].push({midi, x:0, y, w:W, h:wh, el:div});
  });

  // 黒鍵（白鍵にまたがるよう配置）
  // between=i → 白鍵 i と i+1 の境界をまたぐ
  BD.forEach(def => {
    const midi  = (oct+1)*12 + def.s;
    const i     = def.b;
    // 境界のY座標（白鍵 i の下端 + gap/2）
    const boundary = i * (wh + gap) + wh + gap / 2;
    // 黒鍵は境界を中心に上下両白鍵にまたがる
    const bkH   = wh * 0.95;    // 白鍵とほぼ同高さ → 両側にはみ出す
    const bkW   = W  * 0.52;    // 幅は列の52%（右寄せ）
    const y     = boundary - bkH / 2;
    const x     = 0;  // 左側に配置
    const div   = document.createElement('div');
    div.className = 'bk';
    div.style.cssText = `top:${y}px;height:${bkH}px;left:${x}px;width:${bkW}px;`;
    el.appendChild(div);
    kd[side].push({midi, x, y, w:bkW, h:bkH, el:div});
  });
}

function buildAll() {
  buildCol('l', baseOct+1);  // 左列=高音
  buildCol('r', baseOct);    // 右列=低音
  document.getElementById('ll').textContent   = 'Oct '+(baseOct+1);
  document.getElementById('lr').textContent   = 'Oct '+baseOct;
  document.getElementById('oct-lbl').textContent = 'Oct '+baseOct+' · '+(baseOct+1);
  document.getElementById('od').classList.toggle('off', baseOct<=1);
  document.getElementById('ou').classList.toggle('off', baseOct>=6);
}

// ── ヒットテスト ──────────────────────────────
// 各列のBoundingRectを毎回取得し、内部座標で判定
function hitTest(cx, cy) {
  for (const side of ['l','r']) {
    const el   = document.getElementById(side==='l'?'kl':'kr');
    const rect = el.getBoundingClientRect();
    if (cx < rect.left || cx > rect.right || cy < rect.top || cy > rect.bottom) continue;
    const lx = cx - rect.left;
    const ly = cy - rect.top;
    // 黒鍵優先（後ろから検索）
    const keys = kd[side];
    for (let i = keys.length-1; i >= 0; i--) {
      const k = keys[i];
      if (lx >= k.x && lx <= k.x+k.w && ly >= k.y && ly <= k.y+k.h) return k.midi;
    }
  }
  return null;
}

// ── 押鍵状態管理 ─────────────────────────────
const pressed = new Set();

function updateDisplay() {
  const n = document.getElementById('note');
  const s = document.getElementById('sub');
  if (!pressed.size) {
    n.textContent = '---'; n.classList.remove('chord'); s.textContent='押している音';
  } else {
    const sorted = [...pressed].sort((a,b)=>a-b);
    n.textContent = sorted.map(midi2name).join('  ');
    n.classList.toggle('chord', pressed.size>1);
    s.textContent = pressed.size>1 ? pressed.size+'音' : '押している音';
  }
}

function findEl(midi) {
  for (const side of ['l','r']) {
    const k = kd[side].find(k=>k.midi===midi);
    if (k) return k.el;
  }
  return null;
}

function activate(midi) {
  if (midi==null || pressed.has(midi)) return;
  noteOn(midi); pressed.add(midi);
  const el = findEl(midi); if (el) el.classList.add('on');
  updateDisplay();
}

function deactivate(midi) {
  if (midi==null || !pressed.has(midi)) return;
  noteOff(midi); pressed.delete(midi);
  const el = findEl(midi); if (el) el.classList.remove('on');
  updateDisplay();
}

// ── タッチ（documentレベルで捕捉）───────────
// ※ 要素レベルより確実。iOS Safariでの取りこぼしを防ぐ
const tmap = {};

document.addEventListener('touchstart', e => {
  // オクターブボタンは除外
  if (e.target.closest('.obtn')) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const midi = hitTest(t.clientX, t.clientY);
    if (midi==null) continue;
    tmap[t.identifier] = midi;
    activate(midi);
  }
}, {passive:false});

document.addEventListener('touchmove', e => {
  if (e.target.closest('.obtn')) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const newM = hitTest(t.clientX, t.clientY);
    const oldM = tmap[t.identifier];
    if (newM===oldM) continue;
    if (oldM!=null) {
      const still = Object.entries(tmap).some(([id,m])=>m===oldM && +id!==t.identifier);
      if (!still) deactivate(oldM);
    }
    if (newM!=null) { tmap[t.identifier]=newM; activate(newM); }
    else delete tmap[t.identifier];
  }
}, {passive:false});

function onEnd(e) {
  for (const t of e.changedTouches) {
    const midi = tmap[t.identifier];
    delete tmap[t.identifier];
    if (midi==null) continue;
    const still = Object.values(tmap).includes(midi);
    if (!still) deactivate(midi);
  }
}
document.addEventListener('touchend',    onEnd, {passive:false});
document.addEventListener('touchcancel', onEnd, {passive:false});

// ── マウス（デスクトップ・Claude preview用）──
let mdown=false, mmidi=null;
document.addEventListener('mousedown', e => {
  if (e.target.closest('.obtn')) return;
  mdown=true;
  const midi = hitTest(e.clientX, e.clientY);
  mmidi=midi; activate(midi);
});
document.addEventListener('mousemove', e => {
  if (!mdown) return;
  const midi = hitTest(e.clientX, e.clientY);
  if (midi===mmidi) return;
  deactivate(mmidi); activate(midi); mmidi=midi;
});
document.addEventListener('mouseup', () => {
  mdown=false; deactivate(mmidi); mmidi=null;
});

// ── オクターブ ────────────────────────────────
document.getElementById('od').addEventListener('click', ()=>{
  if (baseOct<=1) return;
  [...pressed].forEach(deactivate); baseOct--; buildAll();
});
document.getElementById('ou').addEventListener('click', ()=>{
  if (baseOct>=6) return;
  [...pressed].forEach(deactivate); baseOct++; buildAll();
});

// ── 初期化 ───────────────────────────────────
// DOMContentLoaded + double rAF で確実にレイアウト後に実行
function init() {
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    buildAll();
  }));
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.addEventListener('resize', ()=>{ [...pressed].forEach(deactivate); setTimeout(buildAll,100); });
</script>
</body>
</html>
