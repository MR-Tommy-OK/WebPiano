<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EarPiano</title>
<style>
  :root {
    --bg:      #0e0e0e;
    --surface: #1c1c1c;
    --white:   #efefed;
    --black:   #161616;
    --act-w:   #3d7fff;
    --act-b:   #1e4fcc;
    --text:    #fff;
    --muted:   rgba(255,255,255,0.22);
    --mono:    "SF Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,8px);
  }

  /* ── トップバー（ロゴ＋音名、1行に） ── */
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    gap: 12px;
  }
  #logo {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  #note {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 300;
    letter-spacing: .04em;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #note.dim { color: var(--muted); }

  /* ── オクターブ ── */
  #oct-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 0 6px;
  }
  .obtn {
    width: 40px; height: 40px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,.08);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .obtn.off { opacity: .18; pointer-events: none; }
  #oct-lbl {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    width: 90px;
    text-align: center;
  }

  /* ── 鍵盤エリア ── */
  #kbs {
    flex: 1;
    display: flex;
    gap: 6px;
    padding: 0 10px 10px;
    min-height: 0;
  }
  .col { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .clbl { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; flex-shrink: 0; }
  .kb { flex: 1; position: relative; min-height: 0; }

  /* 鍵 */
  .wk, .bk { position: absolute; left: 0; cursor: pointer; }
  .wk {
    background: var(--white);
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 4px;
    width: 100%;
  }
  .wk.on { background: var(--act-w); }
  .bk {
    background: var(--black);
    border-radius: 3px;
    z-index: 2;
    box-shadow: -2px 2px 6px rgba(0,0,0,.8);
  }
  .bk.on { background: var(--act-b); }

  /* Cのラベル */
  .wlbl {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 8px;
    color: rgba(0,0,0,.3);
    pointer-events: none;
    line-height: 1;
  }
  .wlbl.top    { top: 3px; }
  .wlbl.bottom { bottom: 3px; }
  .wk.on .wlbl { color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="logo">EarPiano</span>
    <div id="note" class="dim">---</div>
  </div>
  <div id="oct-row">
    <div class="obtn" id="od">‹</div>
    <div id="oct-lbl">Oct 3–5 / 4–6</div>
    <div class="obtn" id="ou">›</div>
  </div>
  <div id="kbs">
    <div class="col">
      <div class="clbl" id="ll"></div>
      <div class="kb" id="kl"></div>
    </div>
    <div class="col">
      <div class="clbl" id="lr"></div>
      <div class="kb" id="kr"></div>
    </div>
  </div>
</div>

<script>
// ── Audio ─────────────────────────────────────
// ボイスプール方式: 起動時にオシレーターを事前生成しておき
// noteOn/Off はゲインの変更のみ → 発音遅延を最小化
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const POOL  = 12; // 同時発音の上限

let AC   = null;
let pool = []; // [{osc, gain, midi}]  midi=null なら空き

function initAC() {
  if (AC) {
    // iOS はバックグラウンド後にサスペンドする → 毎回チェック
    if (AC.state === 'suspended') AC.resume();
    return;
  }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e) { return; }

  // 倍音設定を1回だけ作成
  let wave = null;
  try {
    wave = AC.createPeriodicWave(
      new Float32Array([0, 1, 0.28, 0.08, 0.02]),
      new Float32Array(5)
    );
  } catch(e) {}

  // オシレーターをPOOL本まとめて起動（gain=0 で無音待機）
  for (let i = 0; i < POOL; i++) {
    const osc  = AC.createOscillator();
    const gain = AC.createGain();
    if (wave) { try { osc.setPeriodicWave(wave); } catch(e) { osc.type='sine'; } }
    else { osc.type = 'sine'; }
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(AC.destination);
    osc.start();
    pool.push({ osc, gain, midi: null });
  }
}

function midi2freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function midi2name(m) { return NAMES[m % 12] + (Math.floor(m / 12) - 1); }

function noteOn(midi) {
  initAC(); if (!AC) return;

  // 既に同じmidiが鳴っていればそのボイスを再利用
  let v = pool.find(v => v.midi === midi);
  if (!v) v = pool.find(v => v.midi === null);   // 空きボイス
  if (!v) v = pool.reduce((a, b) =>              // 空きなし→最小ゲインを奪う
    a.gain.gain.value <= b.gain.gain.value ? a : b);

  v.midi = midi;
  v.osc.frequency.value = midi2freq(midi);
  // スケジュール済みの変化をキャンセルしてから鳴らす
  v.gain.gain.cancelScheduledValues(AC.currentTime);
  v.gain.gain.setValueAtTime(v.gain.gain.value, AC.currentTime);
  v.gain.gain.linearRampToValueAtTime(0.22, AC.currentTime + 0.008);
}

function noteOff(midi) {
  const v = pool.find(v => v.midi === midi); if (!v) return;
  v.midi = null; // 即座に解放（setTimeoutを使わない → 競合なし）
  v.gain.gain.cancelScheduledValues(AC.currentTime);
  v.gain.gain.setValueAtTime(v.gain.gain.value, AC.currentTime);
  v.gain.gain.setTargetAtTime(0, AC.currentTime, 0.07);
}

function silenceAll() {
  // プール全体を強制消音（stuck note の最終手段）
  if (!AC) return;
  pool.forEach(v => {
    v.midi = null;
    v.gain.gain.cancelScheduledValues(AC.currentTime);
    v.gain.gain.setValueAtTime(v.gain.gain.value, AC.currentTime);
    v.gain.gain.setTargetAtTime(0, AC.currentTime, 0.05);
  });
}

// ── 2オクターブ分のレイアウト定義 ─────────────
// 高音→低音（上→下）の順
// 上オクターブ: highC B A G F E D (middleC) + 下オクターブ: B A G F E D C
const WD = [
  {s:24},{s:23},{s:21},{s:19},{s:17},{s:16},{s:14}, // 上オクターブ白鍵
  {s:12},                                             // ミドルC（境界）
  {s:11},{s:9},{s:7},{s:5},{s:4},{s:2},{s:0}         // 下オクターブ白鍵
]; // 15鍵

const BD = [
  // 上オクターブ黒鍵（白鍵index間）
  {s:22,b:1},{s:20,b:2},{s:18,b:3},{s:15,b:5},{s:13,b:6},
  // 下オクターブ黒鍵
  {s:10,b:8},{s:8,b:9},{s:6,b:10},{s:3,b:12},{s:1,b:13}
]; // 10鍵

const kd = {l:[], r:[]};
let baseOct = 3;

function buildCol(side, oct) {
  const el = document.getElementById(side==='l'?'kl':'kr');
  el.innerHTML = ''; kd[side] = [];
  const W = el.offsetWidth, H = el.offsetHeight;
  if (!W||!H) { setTimeout(()=>buildCol(side,oct),60); return; }

  const gap = 1.2;
  const wh  = (H - gap*14) / 15;  // 15白鍵, 14ギャップ
  const bh  = wh * 0.95;           // 黒鍵高さ（またがる）
  const bw  = W  * 0.52;           // 黒鍵幅

  // 白鍵（i=0=highC が上、i=14=C が下）
  WD.forEach((def, i) => {
    const midi = (oct+1)*12 + def.s;
    const y    = i * (wh + gap);
    const div  = document.createElement('div');
    div.className = 'wk';
    div.style.cssText = `top:${y}px;height:${wh}px;width:${W}px;`;

    // C音（s=0,12,24）にラベル
    if (def.s===0||def.s===12||def.s===24) {
      const lbl = document.createElement('span');
      // 上端のhighC→topラベル、それ以外→bottomラベル
      lbl.className = 'wlbl ' + (def.s===24 ? 'top' : 'bottom');
      lbl.textContent = midi2name(midi);
      div.appendChild(lbl);
    }
    el.appendChild(div);
    kd[side].push({midi, x:0, y, w:W, h:wh, el:div});
  });

  // 黒鍵（白鍵にまたがる）
  BD.forEach(def => {
    const midi     = (oct+1)*12 + def.s;
    const i        = def.b;
    const boundary = i*(wh+gap) + wh + gap/2;
    const y        = boundary - bh/2;
    const x        = 0; // 左端
    const div  = document.createElement('div');
    div.className = 'bk';
    div.style.cssText = `top:${y}px;height:${bh}px;left:${x}px;width:${bw}px;`;
    el.appendChild(div);
    kd[side].push({midi, x, y, w:bw, h:bh, el:div});
  });
}

function buildAll() {
  // 右列=低音(baseOct)、左列=高音(baseOct+1)
  buildCol('r', baseOct);
  buildCol('l', baseOct+1);

  // ラベル: 各列の音域を表示
  const lo = baseOct, hi = baseOct+1;
  document.getElementById('ll').textContent = `C${hi+1}–C${hi+3}`;
  document.getElementById('lr').textContent = `C${lo+1}–C${lo+3}`;
  document.getElementById('oct-lbl').textContent =
    `C${lo+1}–C${lo+3} / C${hi+1}–C${hi+3}`;
  document.getElementById('od').classList.toggle('off', baseOct<=1);
  document.getElementById('ou').classList.toggle('off', baseOct>=5);
}

// ── ヒットテスト（{midi, el} を返す）────────
// 視覚と音声を分離するため、押した鍵のelも返す
function hitTest(cx, cy) {
  for (const side of ['l','r']) {
    const el = document.getElementById(side==='l'?'kl':'kr');
    const rect = el.getBoundingClientRect();
    if (cx<rect.left||cx>rect.right||cy<rect.top||cy>rect.bottom) continue;
    const lx=cx-rect.left, ly=cy-rect.top;
    const keys=kd[side];
    for (let i=keys.length-1;i>=0;i--) {
      const k=keys[i];
      if (lx>=k.x&&lx<=k.x+k.w&&ly>=k.y&&ly<=k.y+k.h) return {midi:k.midi, el:k.el};
    }
  }
  return null;
}

// ── 押鍵管理 ──────────────────────────────────
// 視覚 → 押した鍵のelを直接操作（重複音域で反対側が光らない）
// 音声 → MIDIで管理（同じ音は1つだけ鳴る）
const pressed = new Set(); // 鳴っているMIDIのセット

function updateDisplay() {
  const n = document.getElementById('note');
  if (!pressed.size) {
    n.textContent='---'; n.classList.add('dim');
  } else {
    n.textContent=[...pressed].sort((a,b)=>a-b).map(midi2name).join('  ');
    n.classList.remove('dim');
  }
}

// tmap: touchId → {midi, el}  ※elは実際に押した鍵の要素
const tmap = {};

function pressKey(id, hit) {
  tmap[id] = hit;
  hit.el.classList.add('on');                   // 押した鍵だけ光らせる
  if (!pressed.has(hit.midi)) {
    noteOn(hit.midi); pressed.add(hit.midi);    // 同じ音が既に鳴ってなければ発音
  }
  updateDisplay();
}

function releaseTouch(id) {
  const old = tmap[id]; if (!old) return;
  delete tmap[id];
  // 同じelを押している他のタッチがなければ消灯
  if (!Object.values(tmap).some(e=>e.el===old.el)) old.el.classList.remove('on');
  // 同じmidiを押している他のタッチがなければ消音
  if (!Object.values(tmap).some(e=>e.midi===old.midi)) {
    noteOff(old.midi); pressed.delete(old.midi);
  }
  updateDisplay();
}

function releaseAll() {
  Object.keys(tmap).forEach(id => releaseTouch(id));
  [...pressed].forEach(m => { pressed.delete(m); });
  silenceAll(); // tmap・pressed に残ってなくても全ボイスを消す
  updateDisplay();
}

// ── タッチ（documentレベル） ──────────────────
document.addEventListener('touchstart', e=>{
  if(e.target.closest('.obtn')) return;
  e.preventDefault();
  // 行方不明タッチ掃除
  const live=new Set([...e.touches].map(t=>t.identifier));
  for(const id in tmap) { if(!live.has(+id)) releaseTouch(id); }
  for(const t of e.changedTouches) {
    const hit=hitTest(t.clientX,t.clientY);
    if(hit==null) continue;
    pressKey(t.identifier, hit);
  }
},{passive:false});

document.addEventListener('touchmove', e=>{
  if(e.target.closest('.obtn')) return;
  e.preventDefault();
  for(const t of e.changedTouches) {
    const newHit=hitTest(t.clientX,t.clientY);
    const oldEntry=tmap[t.identifier];
    // 同じ鍵ならスキップ
    if(newHit&&oldEntry&&newHit.el===oldEntry.el) continue;
    releaseTouch(t.identifier);
    if(newHit) pressKey(t.identifier, newHit);
  }
},{passive:false});

function onEnd(e) {
  for(const t of e.changedTouches) releaseTouch(t.identifier);
  if(e.touches.length===0&&pressed.size>0) releaseAll();
}
document.addEventListener('touchend',    onEnd,{passive:false});
document.addEventListener('touchcancel', onEnd,{passive:false});

document.addEventListener('visibilitychange',()=>{
  if (document.hidden) {
    releaseAll();
  } else {
    // 復帰時: サスペンド解除
    if (AC && AC.state === 'suspended') AC.resume();
  }
});
window.addEventListener('blur', releaseAll);

// ── マウス（デスクトップ確認用） ─────────────
let mdown=false, mhit=null;
document.addEventListener('mousedown',e=>{
  if(e.target.closest('.obtn')) return;
  mdown=true; mhit=hitTest(e.clientX,e.clientY);
  if(mhit) pressKey('mouse', mhit);
});
document.addEventListener('mousemove',e=>{
  if(!mdown) return;
  const newHit=hitTest(e.clientX,e.clientY);
  if(newHit&&mhit&&newHit.el===mhit.el) return;
  releaseTouch('mouse');
  if(newHit) pressKey('mouse', newHit);
  mhit=newHit;
});
document.addEventListener('mouseup',()=>{ mdown=false; releaseTouch('mouse'); mhit=null; });

// ── オクターブ ────────────────────────────────
document.getElementById('od').addEventListener('click',()=>{
  if(baseOct<=1) return; releaseAll(); baseOct--; buildAll();
});
document.getElementById('ou').addEventListener('click',()=>{
  if(baseOct>=5) return; releaseAll(); baseOct++; buildAll();
});

// ── 初期化 ───────────────────────────────────
if(document.readyState==='loading') {
  document.addEventListener('DOMContentLoaded',
    ()=>requestAnimationFrame(()=>requestAnimationFrame(buildAll)));
} else {
  requestAnimationFrame(()=>requestAnimationFrame(buildAll));
}
window.addEventListener('resize',()=>{ [...pressed].forEach(deactivate); setTimeout(buildAll,100); });
</script>
</body>
</html>
