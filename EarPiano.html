<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EarPiano</title>
<style>
  :root {
    --bg:        #0e0e0e;
    --surface:   #1a1a1a;
    --border:    rgba(255,255,255,0.07);
    --white-key: #f0f0ee;
    --black-key: #141414;
    --active:    #3d7fff;
    --active-bk: #2558cc;
    --text:      #ffffff;
    --muted:     rgba(255,255,255,0.25);
    --dimmed:    rgba(255,255,255,0.10);
    --font-mono: "SF Mono", ui-monospace, monospace;
    --font-sans: -apple-system, "Helvetica Neue", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }

  /* ── ヘッダー ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    flex-shrink: 0;
  }

  #logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── 音名表示エリア ── */
  #display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 24px;
    min-height: 0;
  }

  #note-label {
    font-family: var(--font-mono);
    font-size: clamp(44px, 14vw, 80px);
    font-weight: 100;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    transition: font-size 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  #note-label.chord {
    font-size: clamp(26px, 7vw, 44px);
  }

  #note-sublabel {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    font-family: var(--font-mono);
  }

  /* ── オクターブセレクタ ── */
  #octave-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 0;
    flex-shrink: 0;
  }

  .oct-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, opacity 0.1s;
  }
  .oct-btn:active { background: #2a2a2a; }
  .oct-btn.disabled { opacity: 0.2; pointer-events: none; }

  #octave-label {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text);
    width: 90px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* ── 鍵盤エリア ── */
  #keyboard-wrap {
    flex-shrink: 0;
    padding: 0 10px 10px;
    height: 200px;
    position: relative;
    touch-action: none;
  }

  #keyboard {
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 白鍵・黒鍵は JS で position:absolute して描画 */
  .wkey, .bkey {
    position: absolute;
    top: 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.04s;
    touch-action: none;
  }

  .wkey {
    background: var(--white-key);
    border: 1px solid rgba(0,0,0,0.18);
    height: 100%;
  }
  .wkey.active { background: var(--active); }

  .bkey {
    background: var(--black-key);
    height: 62%;
    z-index: 2;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 -2px 3px rgba(255,255,255,0.04);
  }
  .bkey.active { background: var(--active-bk); }

  /* 白鍵のCラベル */
  .key-label {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-family: var(--font-mono);
    color: rgba(0,0,0,0.3);
    pointer-events: none;
    white-space: nowrap;
  }
  .wkey.active .key-label { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span id="logo">EarPiano</span>
  </div>

  <div id="display">
    <div id="note-label">---</div>
    <div id="note-sublabel">押している音</div>
  </div>

  <div id="octave-row">
    <div class="oct-btn" id="oct-down">‹</div>
    <div id="octave-label">Octave 4</div>
    <div class="oct-btn" id="oct-up">›</div>
  </div>

  <div id="keyboard-wrap">
    <div id="keyboard"></div>
  </div>
</div>

<script>
// ============================================================
// AudioEngine
// iOS Safari: ユーザー操作後に AudioContext を生成する必要がある
// ============================================================

let ctx = null;
const oscillators = {}; // midi -> { osc, gain }

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function ensureCtx() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  // iOS: resumeが必要なケースがある
  if (ctx.state === 'suspended') ctx.resume();
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function midiToName(midi) {
  const oct = Math.floor(midi / 12) - 1;
  return NOTE_NAMES[midi % 12] + oct;
}

function noteOn(midi) {
  if (oscillators[midi]) return;
  ensureCtx();

  const freq = midiToFreq(midi);
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();

  // 正弦波 + 倍音でピアノっぽく
  osc.type = 'custom';
  const real = new Float32Array([0, 1, 0.28, 0.08, 0.02]);
  const imag = new Float32Array(real.length);
  osc.setPeriodicWave(ctx.createPeriodicWave(real, imag));
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.008);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();

  oscillators[midi] = { osc, gain };
}

function noteOff(midi) {
  const o = oscillators[midi];
  if (!o) return;
  const { gain } = o;
  gain.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
  setTimeout(() => {
    try { o.osc.stop(); } catch(e) {}
    delete oscillators[midi];
  }, 400);
}

// ============================================================
// 鍵盤レイアウト
// ============================================================

const WHITE_SEMITONES = [0, 2, 4, 5, 7, 9, 11];
// 黒鍵: [半音インデックス, 白鍵何番目の右寄り]
const BLACK_NOTES = [
  { s: 1,  pos: 0.65 },
  { s: 3,  pos: 1.65 },
  { s: 6,  pos: 3.65 },
  { s: 8,  pos: 4.65 },
  { s: 10, pos: 5.65 },
];

let octave = 4;
let keyElements = []; // { el, midi, isBlack }

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  keyElements = [];

  const totalW = kb.offsetWidth;
  const gap    = 1;
  const whiteW = (totalW - gap * 6) / 7;
  const blackW = whiteW * 0.60;

  // 白鍵
  WHITE_SEMITONES.forEach((s, i) => {
    const midi = (octave + 1) * 12 + s;
    const el   = document.createElement('div');
    el.className = 'wkey';
    el.style.left  = (i * (whiteW + gap)) + 'px';
    el.style.width = whiteW + 'px';

    // Cだけラベル
    if (s === 0) {
      const lbl = document.createElement('span');
      lbl.className = 'key-label';
      lbl.textContent = midiToName(midi);
      el.appendChild(lbl);
    }

    kb.appendChild(el);
    keyElements.push({ el, midi, isBlack: false });
  });

  // 黒鍵
  BLACK_NOTES.forEach(({ s, pos }) => {
    const midi = (octave + 1) * 12 + s;
    const el   = document.createElement('div');
    el.className = 'bkey';
    const x = pos * (whiteW + gap) - blackW / 2;
    el.style.left  = x + 'px';
    el.style.width = blackW + 'px';
    kb.appendChild(el);
    keyElements.push({ el, midi, isBlack: true });
  });
}

// ============================================================
// ヒットテスト（黒鍵優先）
// ============================================================

function hitTest(x, y) {
  const kb   = document.getElementById('keyboard');
  const rect = kb.getBoundingClientRect();
  const lx   = x - rect.left;
  const ly   = y - rect.top;

  // 後ろから（黒鍵が後ろにあるので優先される）
  for (let i = keyElements.length - 1; i >= 0; i--) {
    const { el, midi } = keyElements[i];
    const kr = el.getBoundingClientRect();
    const klx = kr.left - rect.left;
    const kly = kr.top  - rect.top;
    if (lx >= klx && lx <= klx + kr.width &&
        ly >= kly && ly <= kly + kr.height) {
      return midi;
    }
  }
  return null;
}

// ============================================================
// 音名表示
// ============================================================

const pressedMidis = new Set();

function updateDisplay() {
  const label    = document.getElementById('note-label');
  const sublabel = document.getElementById('note-sublabel');

  if (pressedMidis.size === 0) {
    label.textContent = '---';
    label.classList.remove('chord');
    sublabel.textContent = '押している音';
  } else {
    const sorted = [...pressedMidis].sort((a, b) => a - b);
    label.textContent = sorted.map(midiToName).join('  ');
    if (pressedMidis.size > 1) {
      label.classList.add('chord');
      sublabel.textContent = `${pressedMidis.size}音`;
    } else {
      label.classList.remove('chord');
      sublabel.textContent = '押している音';
    }
  }
}

function keyActivate(midi) {
  noteOn(midi);
  pressedMidis.add(midi);
  const k = keyElements.find(k => k.midi === midi);
  if (k) k.el.classList.add('active');
  updateDisplay();
}

function keyDeactivate(midi) {
  noteOff(midi);
  pressedMidis.delete(midi);
  const k = keyElements.find(k => k.midi === midi);
  if (k) k.el.classList.remove('active');
  updateDisplay();
}

// ============================================================
// マルチタッチハンドラ
// ============================================================

const touchMap = {}; // touchId -> midi

document.getElementById('keyboard').addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const midi = hitTest(t.clientX, t.clientY);
    if (midi == null) continue;
    touchMap[t.identifier] = midi;
    keyActivate(midi);
  }
}, { passive: false });

document.getElementById('keyboard').addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const newMidi = hitTest(t.clientX, t.clientY);
    const oldMidi = touchMap[t.identifier];
    if (newMidi === oldMidi) continue;

    // 離鍵（他の指が同じキーを押してなければ）
    if (oldMidi != null) {
      const stillPressed = Object.entries(touchMap)
        .some(([id, m]) => m === oldMidi && Number(id) !== t.identifier);
      if (!stillPressed) keyDeactivate(oldMidi);
    }

    // 押鍵
    if (newMidi != null) {
      touchMap[t.identifier] = newMidi;
      keyActivate(newMidi);
    } else {
      delete touchMap[t.identifier];
    }
  }
}, { passive: false });

function touchRelease(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const midi = touchMap[t.identifier];
    if (midi == null) continue;
    delete touchMap[t.identifier];
    const stillPressed = Object.values(touchMap).includes(midi);
    if (!stillPressed) keyDeactivate(midi);
  }
}
document.getElementById('keyboard').addEventListener('touchend',    touchRelease, { passive: false });
document.getElementById('keyboard').addEventListener('touchcancel', touchRelease, { passive: false });

// ============================================================
// マウス対応（Mac/PCでのデバッグ用）
// ============================================================

let mouseDown = false;
let mouseMidi = null;

document.getElementById('keyboard').addEventListener('mousedown', e => {
  mouseDown = true;
  const midi = hitTest(e.clientX, e.clientY);
  if (midi == null) return;
  mouseMidi = midi;
  keyActivate(midi);
});
document.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const midi = hitTest(e.clientX, e.clientY);
  if (midi === mouseMidi) return;
  if (mouseMidi != null) keyDeactivate(mouseMidi);
  if (midi != null) keyActivate(midi);
  mouseMidi = midi;
});
document.addEventListener('mouseup', () => {
  mouseDown = false;
  if (mouseMidi != null) { keyDeactivate(mouseMidi); mouseMidi = null; }
});

// ============================================================
// オクターブ切り替え
// ============================================================

function updateOctaveUI() {
  document.getElementById('octave-label').textContent = `Octave ${octave}`;
  document.getElementById('oct-down').classList.toggle('disabled', octave <= 1);
  document.getElementById('oct-up').classList.toggle('disabled', octave >= 7);
}

function changeOctave(delta) {
  const next = octave + delta;
  if (next < 1 || next > 7) return;

  // 押中のノートをすべてリセット
  [...pressedMidis].forEach(keyDeactivate);
  Object.keys(touchMap).forEach(id => delete touchMap[id]);

  octave = next;
  updateOctaveUI();
  buildKeyboard();
}

document.getElementById('oct-down').addEventListener('click', () => changeOctave(-1));
document.getElementById('oct-up').addEventListener('click',   () => changeOctave(+1));

// ============================================================
// 初期化
// ============================================================

window.addEventListener('load', () => {
  buildKeyboard();
  updateOctaveUI();
  // 画面スリープ防止（WakeLock API）
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
});

// リサイズ時に鍵盤再構築
window.addEventListener('resize', () => {
  [...pressedMidis].forEach(keyDeactivate);
  buildKeyboard();
});
</script>
</body>
</html>
