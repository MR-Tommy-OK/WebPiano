<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EarPiano</title>
<style>
  :root {
    --bg:        #0e0e0e;
    --surface:   #1a1a1a;
    --border:    rgba(255,255,255,0.07);
    --white-key: #f0f0ee;
    --black-key: #141414;
    --active:    #3d7fff;
    --active-bk: #2558cc;
    --text:      #ffffff;
    --muted:     rgba(255,255,255,0.25);
    --font-mono: "SF Mono", ui-monospace, monospace;
    --font-sans: -apple-system, "Helvetica Neue", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    /* safe-area はフォールバック付きで */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #header {
    flex-shrink: 0;
    padding: 14px 20px 10px;
  }
  #logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
  }
  #display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 24px;
    min-height: 0;
  }
  #note-label {
    font-family: var(--font-mono);
    font-size: 72px;
    font-weight: 100;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  #note-label.chord { font-size: 36px; }
  #note-sublabel {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    font-family: var(--font-mono);
  }
  #octave-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 0;
  }
  .oct-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .oct-btn.disabled { opacity: 0.2; pointer-events: none; }
  #octave-label {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text);
    width: 90px;
    text-align: center;
  }
  /* 鍵盤ラッパー: 固定高さ、幅は全幅 */
  #keyboard-wrap {
    flex-shrink: 0;
    height: 200px;
    padding: 0 10px 16px;
  }
  #keyboard {
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .wkey, .bkey {
    position: absolute;
    top: 0;
    border-radius: 6px;
    cursor: pointer;
    touch-action: none;
  }
  .wkey {
    background: var(--white-key);
    border: 1px solid rgba(0,0,0,0.18);
    height: 100%;
  }
  .wkey.active { background: var(--active); }
  .bkey {
    background: var(--black-key);
    height: 62%;
    z-index: 2;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
  }
  .bkey.active { background: var(--active-bk); }
  .key-label {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-family: var(--font-mono);
    color: rgba(0,0,0,0.3);
    pointer-events: none;
    white-space: nowrap;
  }
  .wkey.active .key-label { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="app">
  <div id="header"><span id="logo">EarPiano</span></div>
  <div id="display">
    <div id="note-label">---</div>
    <div id="note-sublabel">押している音</div>
  </div>
  <div id="octave-row">
    <div class="oct-btn" id="oct-down">‹</div>
    <div id="octave-label">Octave 4</div>
    <div class="oct-btn" id="oct-up">›</div>
  </div>
  <div id="keyboard-wrap">
    <div id="keyboard"></div>
  </div>
</div>

<script>
// ── Audio ─────────────────────────────────────────────
let ctx = null;
const oscs = {};

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function ensureCtx() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function midiToName(m) { return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }

function noteOn(midi) {
  if (oscs[midi]) return;
  ensureCtx();
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'custom';
  const real = new Float32Array([0, 1, 0.28, 0.08, 0.02]);
  const imag = new Float32Array(real.length);
  osc.setPeriodicWave(ctx.createPeriodicWave(real, imag));
  osc.frequency.value = midiToFreq(midi);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.008);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  oscs[midi] = { osc, gain };
}

function noteOff(midi) {
  const o = oscs[midi];
  if (!o) return;
  o.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
  setTimeout(() => { try { o.osc.stop(); } catch(e){} delete oscs[midi]; }, 400);
}

// ── Layout ────────────────────────────────────────────
const WHITE_S = [0, 2, 4, 5, 7, 9, 11];
const BLACK_N = [{s:1,p:0.65},{s:3,p:1.65},{s:6,p:3.65},{s:8,p:4.65},{s:10,p:5.65}];

let octave = 4;
let keyEls = []; // { el, midi }

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  keyEls = [];

  const totalW = kb.offsetWidth;
  // offsetWidthが0なら少し待って再試行
  if (totalW === 0) {
    setTimeout(buildKeyboard, 50);
    return;
  }

  const gap    = 1;
  const whiteW = (totalW - gap * 6) / 7;
  const blackW = whiteW * 0.60;

  WHITE_S.forEach((s, i) => {
    const midi = (octave + 1) * 12 + s;
    const el   = document.createElement('div');
    el.className = 'wkey';
    el.style.left  = (i * (whiteW + gap)) + 'px';
    el.style.width = whiteW + 'px';
    if (s === 0) {
      const lbl = document.createElement('span');
      lbl.className   = 'key-label';
      lbl.textContent = midiToName(midi);
      el.appendChild(lbl);
    }
    kb.appendChild(el);
    keyEls.push({ el, midi });
  });

  BLACK_N.forEach(({ s, p }) => {
    const midi = (octave + 1) * 12 + s;
    const el   = document.createElement('div');
    el.className = 'bkey';
    el.style.left  = (p * (whiteW + gap) - blackW / 2) + 'px';
    el.style.width = blackW + 'px';
    kb.appendChild(el);
    keyEls.push({ el, midi });
  });
}

// ── Hit test ──────────────────────────────────────────
function hitTest(clientX, clientY) {
  const kb   = document.getElementById('keyboard');
  const rect = kb.getBoundingClientRect();
  const lx   = clientX - rect.left;
  const ly   = clientY - rect.top;

  for (let i = keyEls.length - 1; i >= 0; i--) {
    const { el, midi } = keyEls[i];
    const r = el.getBoundingClientRect();
    if (lx >= r.left - rect.left && lx <= r.right  - rect.left &&
        ly >= r.top  - rect.top  && ly <= r.bottom - rect.top) {
      return midi;
    }
  }
  return null;
}

// ── Display ───────────────────────────────────────────
const pressed = new Set();

function updateDisplay() {
  const label = document.getElementById('note-label');
  const sub   = document.getElementById('note-sublabel');
  if (pressed.size === 0) {
    label.textContent = '---';
    label.classList.remove('chord');
    sub.textContent = '押している音';
  } else {
    const sorted = [...pressed].sort((a, b) => a - b);
    label.textContent = sorted.map(midiToName).join('  ');
    label.classList.toggle('chord', pressed.size > 1);
    sub.textContent = pressed.size > 1 ? `${pressed.size}音` : '押している音';
  }
}

function activate(midi) {
  if (midi == null) return;
  noteOn(midi);
  pressed.add(midi);
  const k = keyEls.find(k => k.midi === midi);
  if (k) k.el.classList.add('active');
  updateDisplay();
}

function deactivate(midi) {
  if (midi == null) return;
  noteOff(midi);
  pressed.delete(midi);
  const k = keyEls.find(k => k.midi === midi);
  if (k) k.el.classList.remove('active');
  updateDisplay();
}

// ── Touch ─────────────────────────────────────────────
const tmap = {}; // touchId -> midi

const kb = document.getElementById('keyboard');

kb.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const midi = hitTest(t.clientX, t.clientY);
    if (midi == null) continue;
    tmap[t.identifier] = midi;
    activate(midi);
  }
}, { passive: false });

kb.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const newMidi = hitTest(t.clientX, t.clientY);
    const oldMidi = tmap[t.identifier];
    if (newMidi === oldMidi) continue;
    if (oldMidi != null) {
      const still = Object.entries(tmap).some(([id, m]) => m === oldMidi && Number(id) !== t.identifier);
      if (!still) deactivate(oldMidi);
    }
    if (newMidi != null) {
      tmap[t.identifier] = newMidi;
      activate(newMidi);
    } else {
      delete tmap[t.identifier];
    }
  }
}, { passive: false });

function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const midi = tmap[t.identifier];
    delete tmap[t.identifier];
    if (midi == null) continue;
    const still = Object.values(tmap).includes(midi);
    if (!still) deactivate(midi);
  }
}
kb.addEventListener('touchend',    onTouchEnd, { passive: false });
kb.addEventListener('touchcancel', onTouchEnd, { passive: false });

// ── Mouse (デスクトップ確認用) ────────────────────────
let mdown = false, mmidi = null;
kb.addEventListener('mousedown', e => {
  mdown = true;
  const midi = hitTest(e.clientX, e.clientY);
  mmidi = midi;
  activate(midi);
});
document.addEventListener('mousemove', e => {
  if (!mdown) return;
  const midi = hitTest(e.clientX, e.clientY);
  if (midi === mmidi) return;
  deactivate(mmidi);
  activate(midi);
  mmidi = midi;
});
document.addEventListener('mouseup', () => {
  mdown = false;
  deactivate(mmidi);
  mmidi = null;
});

// ── Octave ────────────────────────────────────────────
function updateOctaveUI() {
  document.getElementById('octave-label').textContent = `Octave ${octave}`;
  document.getElementById('oct-down').classList.toggle('disabled', octave <= 1);
  document.getElementById('oct-up').classList.toggle('disabled',   octave >= 7);
}

function changeOctave(d) {
  const next = octave + d;
  if (next < 1 || next > 7) return;
  [...pressed].forEach(deactivate);
  Object.keys(tmap).forEach(id => delete tmap[id]);
  octave = next;
  updateOctaveUI();
  buildKeyboard();
}

document.getElementById('oct-down').addEventListener('click', () => changeOctave(-1));
document.getElementById('oct-up').addEventListener('click',   () => changeOctave(+1));

// ── Init ──────────────────────────────────────────────
// requestAnimationFrame でレイアウト確定後に鍵盤を描画
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    buildKeyboard();
    updateOctaveUI();
  });
});

window.addEventListener('resize', () => {
  [...pressed].forEach(deactivate);
  buildKeyboard();
});
</script>
</body>
</html>
